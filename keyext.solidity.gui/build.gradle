plugins {
    id 'application'
    id 'com.gradleup.shadow' version "9.4.1"
}

description = "A minimal Swing GUI for the Solidity prover (MVP)"

repositories {
    mavenCentral()
}

dependencies {
    api project(':keyext.solidity.core')

    // core declares picocli as `implementation`, so it is on our runtime classpath (and already
    // in the shadow jar) but not on our compile classpath.
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'ch.qos.logback:logback-classic:1.5.32'
    implementation 'com.formdev:flatlaf:3.7.1'

    testImplementation(platform('org.junit:junit-bom:5.10.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')
}

application {
    mainClass = "org.key_project.solidity.gui.SolidityMain"
}

run {
    workingDir = rootProject.projectDir
}

// See keyext.solidity.core/build.gradle: without the Graal compiler in the boot layer the
// WebAssembly solc runs interpreted, which the GUI feels on every contract it opens.
def graalJit = new org.gradle.process.CommandLineArgumentProvider() {
    @Override
    Iterable<String> asArguments() {
        if (JavaVersion.current() != JavaVersion.VERSION_21) {
            return []
        }
        return ["-XX:+UnlockExperimentalVMOptions", "-XX:+EnableJVMCI",
                "--upgrade-module-path="
                    + project(':keyext.solidity.core').configurations.graalCompiler.asPath]
    }
}

tasks.register('solidityGui', JavaExec) {
    group = "application"
    description = "Open KeYther on a file. Use -PsolFile=Contract.sol (or -PkeyFile=file.key); " +
        "without it the GUI starts empty and the file is picked from File -> Open. " +
        "-Pfunction=name (with -Pcontract=Name when the file declares several) goes straight to " +
        "that function's proof instead of showing the picker."
    mainClass.set("org.key_project.solidity.gui.SolidityMain")
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    jvmArgumentProviders.add(graalJit)
    def requested = project.findProperty('solFile') ?: project.findProperty('keyFile')
    if (requested) {
        args rootProject.ext.resolveSolidityFile(requested)
    }
    def contract = project.findProperty('contract')
    if (contract) {
        args('--contract', contract.toString())
    }
    def function = project.findProperty('function')
    if (function) {
        args('--function', function.toString())
    }
    // forward extra arguments, e.g. -PguiArgs="--some-flag"
    def extra = project.findProperty('guiArgs')
    if (extra) {
        args(*extra.toString().split("\\s+"))
    }
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

def core = project(':keyext.solidity.core')

// run-key.sh's counterpart for KeYther: the IntelliJ plugin and the .run/ configurations launch
// this jar directly. See keyext.solidity.core/build.gradle — Truffle loses its language
// registrations when GraalJS and GraalWasm are shaded, so they ride beside the jar.
tasks.register('stageGraalRuntime', Copy) {
    from core.configurations.graalRuntime
    into layout.buildDirectory.dir("libs/${core.graalRuntimeDir}")
}

tasks.register('stageGraalCompiler', Copy) {
    from core.configurations.graalCompiler
    into layout.buildDirectory.dir("libs/${core.graalCompilerDir}")
}

shadowJar {
    archiveClassifier = "exe"
    archiveBaseName = "keyext.solidity.gui"
    // no version in the name, so that .run/ configurations can point at a stable path
    archiveVersion = ""
    dependsOn 'stageGraalRuntime'
    finalizedBy 'stageGraalCompiler'
    dependencies {
        exclude { it.moduleGroup.startsWith("org.graalvm") }
    }
    manifest {
        attributes["Class-Path"] = core.configurations.graalRuntime.files
                .collect { "${core.graalRuntimeDir}/${it.name}" }.join(" ")
    }
}
