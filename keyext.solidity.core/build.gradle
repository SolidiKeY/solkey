plugins {
     id 'java'
     id 'com.gradleup.shadow' version "9.4.1"
}

description = "The core data structures for KeY for Solidity"

configurations {
    antlr4
    proguardTool
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':key.util')
    api project(':key.ncore')
    api project(':key.ncore.calculus')
    antlr4 "org.antlr:antlr4:4.13.2"
    proguardTool 'com.guardsquare:proguard-gradle:7.5.0'
    api "org.antlr:antlr4-runtime:4.13.2"

    implementation 'org.jspecify:jspecify:1.0.0'
    implementation('com.google.code.gson:gson:2.11.0')
    testImplementation(platform('org.junit:junit-bom:5.10.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')

    // Import the Jackson BOM — pick the version you want
    implementation platform("tools.jackson:jackson-bom:3.1.2")
    implementation "tools.jackson.core:jackson-databind"
    implementation "tools.jackson.core:jackson-core"

    implementation 'ch.qos.logback:logback-classic:1.5.32'

    implementation('info.picocli:picocli:4.7.7')
    annotationProcessor('info.picocli:picocli-codegen:4.7.7')

}

def antlr4OutputKey = String.valueOf(projectDir) + '/build/generated-src/antlr/main/org/key_project/solidity/parser'

sourceSets.main.java.srcDirs(String.valueOf(projectDir) + '/build/generated-src/antlr/main/')


tasks.register('runAntlr4Key', JavaExec) {
    //see incremental task api, prevents rerun if nothing has changed.
    inputs.files "src/main/antlr/KeYSolidityDLLexer.g4", "src/main/antlr/KeYSolidityDLParser.g4",
            "src/main/antlr/Soldity.g4"
    outputs.dir antlr4OutputKey
    classpath = configurations.antlr4
    mainClass.set("org.antlr.v4.Tool")
    args = ["-visitor",
            "-lib", "../key.ncore/src/main/antlr/",
            "-Xexact-output-dir", "-o", antlr4OutputKey,
            //"-package", "org.key_project.solidity.parser",
            "src/main/antlr/KeYSolidityDLLexer.g4",
            "src/main/antlr/KeYSolidityDLParser.g4",
            "src/main/antlr/Solidity.g4"
    ]
    doFirst {
        file(antlr4OutputKey).mkdirs()
        println("create $antlr4OutputKey")
    }
}
compileJava.dependsOn runAntlr4Key

tasks.withType(Test) {
    enableAssertions = true
    doFirst {
        def rulesTestInvocation = ~/^org\.key_project\.solidity\.taclets\.RulesTest\.exampleLoads(?:\(String, Path\))?\[(\d+)]$/
        def selectedRulesTestInvocation = filter.commandLineIncludePatterns.find { it ==~ rulesTestInvocation }

        if (selectedRulesTestInvocation != null) {
            def matcher = selectedRulesTestInvocation =~ rulesTestInvocation
            systemProperty "org.key_project.solidity.taclets.RulesTest.exampleIndex", matcher[0][1]

            filter.commandLineIncludePatterns.remove(selectedRulesTestInvocation)
            filter.includeTestsMatching("org.key_project.solidity.taclets.RulesTest.exampleLoads")
        }
    }
}


checkerFramework {
    if(System.getProperty("ENABLE_NULLNESS")) {
        checkers = [
                "org.checkerframework.checker.nullness.NullnessChecker",
        ]
        extraJavacArgs = [
                "-AonlyDefs=^org\\.key_project\\.solidity\\.(parser\\.builder|program\\.ast)",
                "-Xmaxerrs", "10000",
                "-Astubs=$rootDir/key.util/src/main/checkerframework:permit-nullness-assertion-exception.astub",
                "-AstubNoWarnIfNotFound",
                "-Werror",
                "-Aversion",
        ]
    }
}

def downloadedFile = layout.buildDirectory.file("resources/main/solc")

tasks.register("downloadBinary") {
    outputs.file(downloadedFile)

    doLast {
        def file = downloadedFile.get().asFile
        file.parentFile.mkdirs()

        new URL("https://github.com/argotorg/solidity/releases/download/v0.8.34/solc-static-linux")
                .withInputStream { input ->
                    file.withOutputStream { it << input }
                }

        // Make executable (Linux/macOS)
        if (!file.setExecutable(true)) {
            throw new GradleException("Failed to make solc executable")
        }
    }
}

processResources.dependsOn("downloadBinary")

task proguardAnalyze(dependsOn: jar) {
    group = 'verification'
    description = 'Finds unused public methods in the AST package via ProGuard shrink analysis'

    def unusedReport = layout.buildDirectory.file('reports/proguard/unused-ast-methods.txt')
    def outputJar    = layout.buildDirectory.file('proguard/analyzed.jar')
    def rulesFile    = layout.buildDirectory.file('proguard/rules.pro')

    inputs.files jar.archiveFile, configurations.runtimeClasspath
    outputs.file unusedReport

    doLast {
        rulesFile.get().asFile.parentFile.mkdirs()
        outputJar.get().asFile.parentFile.mkdirs()

        def libLines = configurations.runtimeClasspath.files.collect {
            "-libraryjars ${it.absolutePath}"
        }.join('\n')
        def javaHome = System.getProperty('java.home')
        def jmodBase = new File("${javaHome}/jmods/java.base.jmod")

        rulesFile.get().asFile.text = """\
${libLines}
${jmodBase.exists() ? "-libraryjars ${jmodBase.absolutePath}(!**.jar;!module-info.class)" : ''}

-injars ${jar.archiveFile.get().asFile.absolutePath}
-outjars ${outputJar.get().asFile.absolutePath}

-dontoptimize
-dontobfuscate
-dontwarn

-keep class !org.key_project.solidity.program.ast.** { public protected *; }
-keep interface org.key_project.solidity.program.ast.** { *; }
-keepclassmembers,allowshrinking class org.key_project.solidity.program.ast.** {
    public protected *;
}

-printusage '${unusedReport.get().asFile.absolutePath}'
"""
        def javaPath = "${System.getProperty('java.home')}/bin/java"
        def classpathStr = configurations.proguardTool.asPath
        def proc = new ProcessBuilder(
                javaPath, '-cp', classpathStr, 'proguard.ProGuard',
                "@${rulesFile.get().asFile.absolutePath}"
        ).redirectErrorStream(true).start()
        proc.inputStream.eachLine { line -> logger.lifecycle(line) }
        def exitCode = proc.waitFor()
        if (exitCode != 0) throw new GradleException("ProGuard failed with exit code $exitCode")

        logger.lifecycle("ProGuard unused AST report: ${unusedReport.get().asFile.absolutePath}")
    }
}

tasks.jar {
    manifest {
        attributes["Main-Class"] = "org.key_project.solidity.CLI"
    }
}

def solidityCliMainClass = "org.key_project.solidity.CLI"
def solidityExamplesDir = rootProject.file("keyext.solidity.core/src/test/resources/org/key_project/solidity/examples")

tasks.register('solidityCli', JavaExec) {
    group = "application"
    description = "Run the Solidity CLI. Use -PkeyFile=filename.key to specify file."
    mainClass.set(solidityCliMainClass)
    classpath = sourceSets.main.runtimeClasspath
    workingDir = solidityExamplesDir
    args project.findProperty('keyFile') ?: "problem2.key"
}

shadowJar {
    archiveClassifier = "exe"
    archiveBaseName = "keyext.solidity.core"
}
